<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080f13">
  <title>微光之渊 · Glimmer Abyss</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="" aria-label="微光之渊首页"><svg viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1 15 10 23 14 15 18 12 27 9 18 1 14 9 10Z"/><path d="M12 8v12M6 14h12"/></svg><span>微光之渊</span></a>
      <div class="top-actions">
        <div class="best" title="最高纪录"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 4 2 10h8l2-10-4 4-2-5-2 5Z"/><path d="M6 17h8"/></svg><span id="bestCount">000000</span></div>
        <span class="action-divider"></span>
        <button class="icon-button" id="soundButton" type="button" title="关闭声音" aria-label="关闭声音" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
        <button class="icon-button" id="pauseButton" type="button" title="暂停（P）" aria-label="暂停游戏" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
        <button class="icon-button" id="fullscreenButton" type="button" title="全屏" aria-label="全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
      </div>
    </header>
    <section class="game-shell" id="gameShell" aria-label="微光之渊跑酷游戏">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="游戏画面。空格二段跳，左键攻击，右键反重力，Shift 冲刺，Q 弹反，F 大招，S 俯冲，P 暂停。手柄 A 跳跃，X 攻击，LT 冲刺，RT 反重力，LB 弹反，Y 大招，B 俯冲。">请使用支持 Canvas 的浏览器。</canvas>
      <div class="hud" id="hud" hidden>
        <div class="hud-left"><div id="hearts" class="hearts" aria-label="生命值 3">♥ ♥ ♥</div><div class="zone" id="chapter">01 / 苔光入口</div></div>
        <div class="score-block"><div class="score-line"><span id="scoreCount">000000</span><span class="combo" id="comboCount">×1</span></div><div class="combo-track"><i id="comboFill"></i></div><div class="charge-meters"><div class="rush-meter" id="rushMeter"><span id="rushLabel">萤火</span><div><i id="rushFill"></i></div></div><div class="ultimate-meter" id="ultimateMeter"><span><kbd id="ultimateKey">F</kbd> <b id="ultimateLabel">大招</b></span><div><i id="ultimateFill"></i></div></div></div><span class="weapon-label" id="weaponLabel"></span></div>
        <div class="skill-status"><div><span><kbd id="dashKey">⇧</kbd> 冲刺</span><div class="skill-meter"><i id="dashFill"></i></div></div><div><span><kbd id="gravityKey">右键</kbd> <b id="gravityLabel">重力</b></span><div class="skill-meter violet"><i id="gravityFill"></i></div></div><div><span><kbd id="parryKey">Q</kbd> 弹反</span><div class="skill-meter"><i id="parryFill"></i></div></div></div>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="overlay" id="overlay">
        <div class="intro-mark" id="overlayEyebrow"><i></i> GLIMMER ABYSS</div>
        <h1 id="overlayTitle">微光<span>之渊</span></h1>
        <p class="overlay-subtitle" id="overlaySubtitle">跃入幽暗，追逐微光。</p>
        <div class="result" id="result" hidden><span id="resultScore">0</span><div id="resultStats"></div></div>
        <div class="overlay-actions"><button class="primary-button" id="startButton" type="button"><span id="startLabel">跃入深渊</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button><button class="secondary-button" id="restartButton" type="button" hidden>重新开始</button></div>
      </div>
      <div class="distance" id="distance" hidden>0 m</div>
      <div class="mobile-controls" id="mobileControls" aria-label="触屏操作" hidden><div><button data-control="gravity" aria-label="倒悬">倒悬</button><button data-control="parry" aria-label="弹反">弹反</button><button data-control="ultimate" aria-label="大招">大招</button></div><div><button data-control="dive" aria-label="俯冲">俯冲</button><button data-control="dash" aria-label="冲刺">冲刺</button><button data-control="shoot" aria-label="攻击">攻击</button><button data-control="jump" class="jump-button" aria-label="跳跃">跳跃</button></div></div>
      <div class="corner corner-tl"></div><div class="corner corner-tr"></div><div class="corner corner-bl"></div><div class="corner corner-br"></div>
    </section>
    <footer class="controls" id="keyboardControls" aria-label="操作提示"><span><kbd>SPACE</kbd><b>二段跳</b></span><span><kbd>左键</kbd><b>攻击</b></span><span><kbd>右键</kbd><b>重力</b></span><span><kbd>SHIFT</kbd><b>冲刺</b></span><span><kbd>Q</kbd><b>弹反</b></span><span><kbd>F</kbd><b>大招</b></span><span><kbd>S</kbd><b>俯冲</b></span></footer>
    <footer class="controls" id="gamepadControls" aria-label="操作提示" hidden><span><kbd>A</kbd><b>二段跳</b></span><span><kbd>X</kbd><b>攻击</b></span><span><kbd>RT</kbd><b>重力</b></span><span><kbd>LT</kbd><b>冲刺</b></span><span><kbd>LB</kbd><b>弹反</b></span><span><kbd>Y</kbd><b>大招</b></span><span><kbd>B</kbd><b>俯冲</b></span></footer>
  </main>
  <script src="music.js"></script>
  <script src="gamepad.js"></script>
  <script src="scenery.js"></script>
  <script src="runner.js"></script>
</body>
</html>
